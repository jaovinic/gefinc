name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      # O Docker já está disponível no runner; o Testcontainers sobe o PostgreSQL 16 dos testes de integração.
      - run: npx nx affected -t lint test build
