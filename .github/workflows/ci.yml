name: CI

on:
  push:
    branches: [main]
  pull_request:

# O nx-set-shas consulta a API de execuções do GitHub Actions para achar o último CI verde da main.
permissions:
  contents: read
  actions: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      # Mudanças em tools/ não marcam web/mobile como afetados; o teste do verificador roda sempre.
      - run: node --test tools/check-prod-bundle.test.mjs

      # O Docker já está disponível no runner; o Testcontainers sobe o PostgreSQL 16 dos testes de integração.
      - run: npx nx affected -t lint test build check-prod-bundle
