spring:
  application:
    name: gefinc-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # Padrões para dev (Mailpit/GreenMail: sem login nem TLS). Em produção defina SMTP_HOST, SMTP_PORT,
    # SMTP_USER, SMTP_PASSWORD, SMTP_AUTH=true e SMTP_STARTTLS=true (ex.: Brevo, porta 587).
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
            # Com STARTTLS ligado ele é obrigatório: nunca envia login e chave SMTP em texto puro.
            required: ${SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  # Mantenha `none`: o IP real do cliente vem de app.security.client-ip-header e só é aceito quando a
  # conexão chega de um proxy listado em app.security.trusted-proxies. `native` faria o Tomcat confiar
  # em X-Forwarded-For, que um cliente pode forjar.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  timezone: America/Sao_Paulo
  base-url: ${APP_BASE_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:no-reply@gefinc.local}
  # Chave HMAC dos identificadores pseudonimizados (auditoria, histórico de envios): mínimo de 32 bytes,
  # distinta do JWT_SECRET. Sem valor padrão: a aplicação não sobe sem ela.
  pseudonym-secret: ${PSEUDONYM_SECRET}
  security:
    jwt-secret: ${JWT_SECRET}
    # CIDRs dos proxies confiáveis (ex.: 172.28.0.10/32, o cloudflared). Vazio = nunca confia no cabeçalho.
    trusted-proxies: ${TRUSTED_PROXY_CIDRS:}
    client-ip-header: ${CLIENT_IP_HEADER:CF-Connecting-IP}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    bcrypt-strength: 12
    cors-origins:
      - ${APP_BASE_URL:http://localhost:4200}
      - http://localhost:8100
      - capacitor://localhost   # app iOS (Capacitor)
      - https://localhost       # app Android (Capacitor)
      - http://localhost
  admin:
    page-size: 25
    max-page-size: 100
    search-max-length: 100
    stats-cache-ttl: 60s
    invitation-ttl: 7d
    reauth-max-failures: 5
    rate:
      mutating-per-minute: 30
      destructive-per-window: 10
      destructive-window: 15m
      reauth-window: 15m
