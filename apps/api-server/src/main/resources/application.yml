spring:
  application:
    name: gefinc-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  timezone: America/Sao_Paulo
  base-url: ${APP_BASE_URL:http://localhost:4200}
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    bcrypt-strength: 12
    cors-origins:
      - ${APP_BASE_URL:http://localhost:4200}
      - http://localhost:8100
      - capacitor://localhost
      - http://localhost
