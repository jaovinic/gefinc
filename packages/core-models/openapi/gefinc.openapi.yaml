openapi: 3.1.0
info:
  title: GEFINC API
  version: 1.0.0
  description: |
    Contrato da API REST do GEFINC (gestão financeira pessoal).

    Convenções:
    - Valores monetários são **strings decimais** com 2 casas (`"1234.56"`), nunca números JSON.
    - Datas de negócio usam `YYYY-MM-DD`; meses usam `YYYY-MM`.
    - Erros seguem RFC 7807 (`application/problem+json`) com o campo estável `code`.
    - Todo recurso pertence ao usuário do token; recurso de outro usuário responde `404`.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Accounts
  - name: Categories
  - name: Transaction Groups
  - name: Transactions
  - name: Invoices
  - name: Transfers
  - name: Dashboard
  - name: Admin
    description: Painel administrativo. Exige papel administrador, verificado no servidor a cada requisição.
  - name: System
    description: Estado público do sistema.

paths:
  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Cria uma conta (FR-001)
      description: |
        Com os cadastros fechados pelo painel responde `403` (`SIGNUPS_CLOSED`); em manutenção, `503`
        (`MAINTENANCE`). Consome convite pendente do mesmo e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica o usuário (FR-002)
      description: |
        Com o cabeçalho `X-Client: web`, o refresh token é entregue em cookie
        `HttpOnly; Secure; SameSite=Strict` e omitido do corpo. Sem ele (mobile), vem no corpo.
        Conta com exclusão pendente responde `423` (`ACCOUNT_DELETION_PENDING`) sem emitir tokens.
        Depois de 5 falhas por e-mail ou 20 por IP em 15 minutos, responde `429` com `Retry-After`,
        mesmo que a senha esteja certa (FR-002).

        Mudanças de comportamento do painel administrativo (aditivas): conta suspensa responde `403`
        (`ACCOUNT_SUSPENDED`) somente depois de credenciais corretas; o `423` passa a informar a data
        real (`deletionDate`, prazo variável), a origem (`origin`) e se o usuário pode cancelar
        (`canCancel`); em manutenção, usuários comuns recebem `503` (`MAINTENANCE`) e administradores
        entram normalmente.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '423':
          description: Exclusão da conta pendente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/DeletionPendingProblem' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renova a sessão com rotação do refresh token (FR-002)
      description: |
        Conta suspensa responde `403` (`ACCOUNT_SUSPENDED`). Em manutenção, usuários comuns recebem
        `503` (`MAINTENANCE`) e o cliente não deve encerrar a sessão por isso.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        description: Obrigatório no mobile; no web o token vem do cookie.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Novos tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Encerra a sessão e revoga o refresh token
      description: |
        No web, o refresh token vem do cookie (cabeçalho `X-Client: web`) e o cookie é apagado. No
        mobile, informe o `refreshToken` no corpo para revogá-lo.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Sessão encerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Solicita link de redefinição de senha (FR-006, FR-007)
      description: Resposta idêntica para e-mails cadastrados e não cadastrados. Limite de 3 por hora por e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Solicitação aceita }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Define nova senha com o token recebido por e-mail (FR-006)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password, minLength: 10, description: 'Mínimo de 10 caracteres e máximo de 72 bytes em UTF-8' }
      responses:
        '204': { description: Senha alterada; sessões anteriores encerradas }
        '400':
          description: Token inválido, usado ou expirado (`INVALID_RESET_TOKEN`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Dados do próprio usuário
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      summary: Altera o nome de exibição (vazio remove o nome)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, 'null'], maxLength: 80 }
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/password:
    post:
      tags: [Auth]
      summary: Troca a senha estando conectado
      description: |
        Exige a senha atual e aplica a política de senha. Todas as sessões anteriores deixam de valer
        e a resposta traz uma sessão nova (mesmo formato do login), para quem trocou seguir conectado.
        Senha atual incorreta ou nova igual à atual respondem `422` com o campo em `errors`.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200':
          description: Senha trocada; nova sessão
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/account-deletion:
    post:
      tags: [Auth]
      summary: Solicita a exclusão da conta com carência de 30 dias (FR-008)
      description: |
        O administrador raiz não pode excluir a própria conta (`403` `ROOT_PROTECTED`) e o último
        administrador ativo também não (`409` `LAST_ADMIN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '202':
          description: Exclusão agendada; sessões encerradas
          content:
            application/json:
              schema:
                type: object
                required: [deletionDate]
                properties:
                  deletionDate:
                    type: string
                    format: date
                    description: Data limite para desistir (hoje + 30 dias)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/account-deletion/cancel:
    post:
      tags: [Auth]
      summary: Cancela a exclusão pendente (FR-009)
      description: |
        Mudança de comportamento (aditiva): só vale para exclusão pedida pelo próprio usuário. Exclusão
        de origem administrativa responde `403` (`ADMIN_DECISION_LOCKED`) e o usuário não a reverte por
        nenhum canal. Em manutenção, `503` (`MAINTENANCE`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '204': { description: Exclusão cancelada; faça login normalmente }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '409':
          description: Não há exclusão pendente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------- Convites, avisos e estado do sistema
  /system/status:
    get:
      tags: [System]
      summary: Estado público do sistema (manutenção e cadastros)
      description: |
        Público e sem dado sensível. Alimenta o aviso das telas de entrada (web e aplicativo):
        manutenção ligada e se os cadastros por conta própria estão abertos.
      security: []
      responses:
        '200':
          description: Estado atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }

  /auth/invitations/{token}:
    get:
      tags: [Auth]
      summary: Consulta um convite de cadastro
      description: |
        Público. Devolve o e-mail convidado e a validade. Token inexistente responde `404`; convite
        expirado ou cancelado, `410` (`INVITATION_EXPIRED`).
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      responses:
        '200':
          description: Convite válido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  /auth/invitations/{token}/accept:
    post:
      tags: [Auth]
      summary: Aceita o convite e cria a conta
      description: |
        Público. Aplica a política de senha existente. Ignora "cadastros fechados". Em manutenção
        responde `503` (`MAINTENANCE`).
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/notices/{noticeId}/dismiss:
    post:
      tags: [Auth]
      summary: Dispensa um aviso entregue ao usuário
      description: A entrega já conta como visto; a dispensa é explícita. Aviso de outro usuário responde `404`.
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      responses:
        '204': { description: Aviso dispensado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------- Painel administrativo
  /admin/users:
    get:
      tags: [Admin]
      summary: Lista usuários (sem dado financeiro)
      description: |
        Exige papel administrador, verificado no servidor a cada requisição (usuário comum recebe
        `403`, visitante `401`). `q` é literal (até 100 caracteres), sem diferenciar caixa nem acento.
        Não é auditada.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, SUSPENDED, DELETION_PENDING, ADMIN] }
        - name: sort
          in: query
          schema: { type: string, enum: [createdAt, lastAccessAt], default: createdAt }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Página de usuários
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/users/{userId}:
    get:
      tags: [Admin]
      summary: Detalhe de um usuário (a abertura é auditada)
      description: Cada abertura registra `USER_DETAIL_OPENED`. Recarregar conta como nova abertura.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Detalhe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      summary: Altera o nome de exibição do usuário
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRenameRequest' }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{userId}/sessions:
    get:
      tags: [Admin]
      summary: Sessões abertas do usuário (dado pessoal)
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Sessões abertas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Encerra todas as sessões do usuário
      description: |
        Vale na requisição seguinte, sem aviso ao usuário. Administrador raiz é protegido (`ROOT_PROTECTED`);
        o administrador não encerra todas as próprias sessões (`409 SELF_ACTION_FORBIDDEN`).
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: Sessões encerradas }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{userId}/sessions/{sessionId}:
    delete:
      tags: [Admin]
      summary: Encerra uma sessão do usuário
      description: |
        Administrador raiz é protegido (`ROOT_PROTECTED`); o administrador não encerra a própria sessão
        atual (`409 SELF_ACTION_FORBIDDEN`), mas pode encerrar as outras.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: Sessão encerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{userId}/suspend:
    post:
      tags: [Admin]
      summary: Suspende o usuário
      description: |
        Recusas: a própria conta (`409 SELF_ACTION_FORBIDDEN`), administrador raiz (`403
        ROOT_PROTECTED`), último administrador ativo (`409 LAST_ADMIN`).
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspendRequest' }
      responses:
        '204': { description: Usuário suspenso }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{userId}/reactivate:
    post:
      tags: [Admin]
      summary: Reativa o usuário suspenso (mantém a exclusão pendente, se houver)
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: Usuário reativado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{userId}/login-lock:
    delete:
      tags: [Admin]
      summary: Retira o bloqueio temporário por tentativas de login
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: Bloqueio retirado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{userId}/password-reset/send:
    post:
      tags: [Admin]
      summary: Reenvia o e-mail de redefinição de senha
      description: |
        Gera um novo link e invalida os anteriores. Conta suspensa ou em exclusão responde `409
        ACCOUNT_NOT_USABLE`; falha de envio, `502 MAIL_DELIVERY_FAILED` (nada é concluído).
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '202': { description: E-mail enviado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /admin/users/{userId}/password-reset/force:
    post:
      tags: [Admin]
      summary: Invalida a senha e as sessões e envia o link de redefinição
      description: |
        Exige a senha do próprio administrador (`403 REAUTH_FAILED`). O administrador nunca vê
        senha, link nem token. Falha de envio desfaz tudo (`502`).
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForcePasswordResetRequest' }
      responses:
        '202': { description: Senha invalidada e e-mail enviado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /admin/users/{userId}/role:
    put:
      tags: [Admin]
      summary: Concede ou retira o perfil de administrador
      description: |
        Exige a senha do próprio administrador (`403 REAUTH_FAILED`). Alvo ativo; raiz protegido
        (`403 ROOT_PROTECTED`); nunca deixa o sistema sem administrador (`409 LAST_ADMIN`).
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleChangeRequest' }
      responses:
        '204': { description: Perfil alterado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{userId}/email-change:
    post:
      tags: [Admin]
      summary: Inicia a troca de e-mail do usuário
      description: |
        Envia um código de 6 dígitos ao **novo** endereço (validade de 15 minutos, no máximo 5
        erros); o e-mail antigo continua válido até a confirmação.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequest' }
      responses:
        '202':
          description: Código enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingEmailChange' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      tags: [Admin]
      summary: Cancela a troca de e-mail pendente
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: Troca cancelada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{userId}/email-change/confirm:
    post:
      tags: [Admin]
      summary: Confirma a troca de e-mail com o código recebido
      description: |
        Código expirado, usado, invalidado, errado ou acima de 5 tentativas responde `422
        EMAIL_CHANGE_CODE_INVALID`. Ao confirmar, encerra as sessões do usuário e avisa os dois
        endereços.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeConfirmRequest' }
      responses:
        '204': { description: E-mail alterado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/users/{userId}/deletion:
    post:
      tags: [Admin]
      summary: Solicita a exclusão da conta do usuário
      description: |
        Exige motivo ativo, justificativa, prazo (imediata ou de 1 a 30 dias), o e-mail do alvo
        digitado e a senha do administrador. Se já houver exclusão do usuário, só antecipa (prazo
        menor; senão `422`). A exclusão imediata tenta o aviso por e-mail e executa antes de
        responder. Recusas: `403 ROOT_PROTECTED`, `409 SELF_ACTION_FORBIDDEN`, `409 LAST_ADMIN`,
        `422 INVALID_CONFIRMATION`, `403 REAUTH_FAILED`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeletionRequest' }
      responses:
        '200':
          description: Exclusão agendada ou executada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionOutcome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Admin]
      summary: Cancela a exclusão com prazo em curso
      description: |
        Restaura o estado anterior e avisa o usuário (e-mail e aviso no aplicativo). Exclusão já
        executada responde `409 DELETION_ALREADY_EXECUTED`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: Exclusão cancelada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/audit:
    get:
      tags: [Admin]
      summary: Trilha de auditoria (somente leitura)
      description: |
        Da mais recente à mais antiga, com cursor opaco e sem total. Não existe escrita nem
        exportação da auditoria.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: actorId
          in: query
          schema: { type: integer, format: int64 }
        - name: targetUserId
          in: query
          schema: { type: integer, format: int64 }
        - name: action
          in: query
          schema: { $ref: '#/components/schemas/AuditAction' }
        - name: result
          in: query
          schema: { $ref: '#/components/schemas/AuditResult' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
      responses:
        '200':
          description: Página da trilha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/audit/{auditId}:
    get:
      tags: [Admin]
      summary: Registro completo da auditoria
      parameters:
        - name: auditId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Registro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/system/health:
    get:
      tags: [Admin]
      summary: Saúde do sistema (sem endereços, credenciais ou mensagens internas)
      responses:
        '200':
          description: Saúde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/system/stats:
    get:
      tags: [Admin]
      summary: Estatísticas de uso (somente contagens)
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
        - name: refresh
          in: query
          description: "`true` ignora o cache de 60 segundos"
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Estatísticas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/alerts:
    get:
      tags: [Admin]
      summary: Alertas permanentes do painel
      responses:
        '200':
          description: Alertas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAlerts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/email/config:
    get:
      tags: [Admin]
      summary: Configuração de envio de e-mail (nunca usuário nem senha)
      responses:
        '200':
          description: Configuração
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/email/test:
    post:
      tags: [Admin]
      summary: Envia um e-mail de teste ao próprio administrador
      description: Envio imediato, uma única tentativa.
      responses:
        '200':
          description: Resultado do envio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/email/deliveries:
    get:
      tags: [Admin]
      summary: Histórico de envios dos últimos 90 dias
      description: Sem corpo, assunto, link, token nem código. Conta removida aparece como `anônimo-…`.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [SENT, FAILED] }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/EmailKind' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
      responses:
        '200':
          description: Página do histórico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailDeliveryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/email/deliveries/{deliveryId}/resend:
    post:
      tags: [Admin]
      summary: Reenvia uma redefinição de senha que falhou
      description: Somente `PASSWORD_RESET` com falha e conta ainda existente; gera um novo link.
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '202': { description: Reenvio aceito }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /admin/communications/pending:
    get:
      tags: [Admin]
      summary: Comunicações pendentes (avisos que não puderam ser enviados)
      description: Não devolve o endereço retido.
      responses:
        '200':
          description: Pendências
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingCommunication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/communications/pending/{pendingId}/resend:
    post:
      tags: [Admin]
      summary: Reenvia o aviso pendente
      parameters:
        - $ref: '#/components/parameters/PendingId'
      responses:
        '200':
          description: Resultado do reenvio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResendResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/communications/pending/{pendingId}/discard:
    post:
      tags: [Admin]
      summary: Descarta o aviso pendente (apaga o endereço retido)
      parameters:
        - $ref: '#/components/parameters/PendingId'
      responses:
        '204': { description: Aviso descartado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/invitations:
    get:
      tags: [Admin]
      summary: Convites de cadastro
      description: O e-mail só aparece enquanto o convite está `PENDING`.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvitationStatus' }
      responses:
        '200':
          description: Convites
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Convida um e-mail a se cadastrar
      description: |
        Convite pendente para o mesmo e-mail é reenviado. Falha no envio responde `502` e o convite
        não é criado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationRequest' }
      responses:
        '201':
          description: Convite criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /admin/invitations/{invitationId}:
    delete:
      tags: [Admin]
      summary: Cancela o convite (zera o e-mail)
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204': { description: Convite cancelado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/invitations/{invitationId}/resend:
    post:
      tags: [Admin]
      summary: Reenvia o convite com novo link (o anterior deixa de valer)
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '202': { description: Convite reenviado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /admin/deletion-reasons:
    get:
      tags: [Admin]
      summary: Motivos de exclusão de conta
      responses:
        '200':
          description: Motivos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeletionReason' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      summary: Cria um motivo de exclusão
      description: A mensagem é genérica; texto com dado pessoal ou marcador de substituição responde `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeletionReasonInput' }
      responses:
        '201':
          description: Motivo criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionReason' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/deletion-reasons/{reasonId}:
    put:
      tags: [Admin]
      summary: Edita um motivo
      description: Não altera as mensagens de exclusões já solicitadas.
      parameters:
        - $ref: '#/components/parameters/ReasonId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeletionReasonInput' }
      responses:
        '200':
          description: Motivo atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionReason' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/deletion-reasons/{reasonId}/deactivate:
    post:
      tags: [Admin]
      summary: Desativa um motivo
      description: O último motivo ativo não pode ser desativado (`409 LAST_ACTIVE_REASON`).
      parameters:
        - $ref: '#/components/parameters/ReasonId'
      responses:
        '204': { description: Motivo desativado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/deletion-reasons/{reasonId}/activate:
    post:
      tags: [Admin]
      summary: Reativa um motivo
      parameters:
        - $ref: '#/components/parameters/ReasonId'
      responses:
        '204': { description: Motivo ativado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/parameters:
    get:
      tags: [Admin]
      summary: Parâmetros do sistema
      description: Os editáveis (cadastros e manutenção) e os somente leitura (sessões, limites de login, carência).
      responses:
        '200':
          description: Parâmetros
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parameters' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/parameters/signups-open:
    put:
      tags: [Admin]
      summary: Abre ou fecha os cadastros por conta própria
      description: Auditado com o valor anterior e o novo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupsOpenRequest' }
      responses:
        '204': { description: Parâmetro alterado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/parameters/maintenance:
    put:
      tags: [Admin]
      summary: Liga ou desliga o modo de manutenção
      description: Em manutenção, só administradores entram; usuários comuns recebem `503 MAINTENANCE`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceRequest' }
      responses:
        '204': { description: Parâmetro alterado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/sessions/revoke-all:
    post:
      tags: [Admin]
      summary: Encerra as sessões de todos os usuários
      description: |
        Preserva a sessão do administrador que acionou e as dos raízes. Exige a senha (`403
        REAUTH_FAILED`) e a palavra de confirmação (`422 INVALID_CONFIRMATION`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeAllRequest' }
      responses:
        '200':
          description: Sessões encerradas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokeAllResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ------------------------------------------------------------ Accounts
  /accounts:
    get:
      tags: [Accounts]
      summary: Lista contas e cartões (FR-011)
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Lista de contas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Accounts]
      summary: Cadastra conta ou cartão (FR-011, FR-012)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      summary: Consulta uma conta
      responses:
        '200':
          description: Conta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Accounts]
      summary: Edita ou inativa/reativa conta (FR-011)
      description: |
        Novos dias de fechamento/vencimento valem para compras futuras. Ocorrências fixas pendentes
        com vencimento futuro são recalculadas, exceto as de faturas com pagamento registrado (FR-014).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Accounts]
      summary: Exclui conta sem nenhum dado relacionado (FR-013)
      description: |
        A conta só é excluída se não tiver lançamentos (nem grupos), pagamentos de fatura, transferências
        (como origem ou destino), cartões vinculados nem saldo inicial diferente de zero. Caso contrário responde `409`
        (`ACCOUNT_IN_USE`) com as contagens; o cliente deve oferecer inativar a conta. A checagem é
        refeita no servidor a cada exclusão. Conta de outro usuário responde `404`.
      responses:
        '204': { description: Excluída }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conta com dados relacionados (`ACCOUNT_IN_USE`); inative em vez de excluir
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/InUseProblem' }

  /accounts/{accountId}/usage:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      summary: Prévia da exclusão da conta
      description: Informa o que impede a exclusão da conta. Não altera nada.
      responses:
        '200':
          description: Uso da conta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountUsage' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------- Categories
  /categories:
    get:
      tags: [Categories]
      summary: Lista categorias (FR-015)
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/CategoryType' }
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Categories]
      summary: Cria categoria (FR-015)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Categories]
      summary: Edita categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Categories]
      summary: Exclui categoria sem uso (FR-016)
      description: |
        A categoria só é excluída se nenhum lançamento nem grupo a usa. Em uso responde `409`
        (`CATEGORY_IN_USE`) com as contagens; os lançamentos não são movidos para outra categoria.
        Categoria de outro usuário responde `404`.
      responses:
        '204': { description: Excluída }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Categoria em uso (`CATEGORY_IN_USE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/InUseProblem' }

  /categories/{categoryId}/usage:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Categories]
      summary: Prévia da exclusão da categoria
      description: Informa quantos lançamentos e grupos usam a categoria. Não altera nada.
      responses:
        '200':
          description: Uso da categoria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryUsage' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------- Transaction groups
  /transaction-groups:
    post:
      tags: [Transaction Groups]
      summary: Registra lançamento fixo, avulso ou parcelado (FR-017 a FR-024)
      description: |
        Gera as ocorrências conforme `recurrenceType`:
        Em conta do tipo `CREDIT_CARD`, o vencimento de **toda** ocorrência é calculado pelo
        servidor a partir de `purchaseDate` e dos dias de fechamento e vencimento do cartão
        (FR-022); `firstDueDate` é ignorado e pode ser omitido. Nas demais contas,
        `firstDueDate` é obrigatório (`422` se ausente). Conta inativa responde `422` (`ACCOUNT_INACTIVE`).
        - `VARIABLE`: 1 ocorrência.
        - `INSTALLMENT`: N parcelas, uma por mês. Soma = `totalAmount` (resto na primeira parcela).
        - `FIXED`: ocorrências mensais para os próximos 12 meses; no cartão, cada mês é tratado
          como compra no dia de `purchaseDate` daquele mês (limitado ao último dia do mês).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionGroupInput' }
      responses:
        '201':
          description: Grupo e ocorrências geradas
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionGroupDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transaction-groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Transaction Groups]
      summary: Consulta um grupo com suas ocorrências
      responses:
        '200':
          description: Grupo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionGroupDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Transaction Groups]
      summary: Edita descrição, categoria e conta das ocorrências pendentes (FR-025)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionGroupUpdate' }
      responses:
        '200':
          description: Atualizado
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionGroupDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Transaction Groups]
      summary: Exclui o grupo e as ocorrências pendentes (FR-025)
      description: |
        Exige `confirm=true`. Ocorrências já pagas são preservadas; consulte antes
        `/transaction-groups/{groupId}/impact`. Se a exclusão violar o saldo de uma fatura
        (restante < 0), responde `409 INVOICE_BALANCE_VIOLATION`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: confirm
          in: query
          required: true
          schema: { type: boolean }
      responses:
        '204':
          description: Excluído
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /transaction-groups/{groupId}/impact:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Transaction Groups]
      summary: Mostra o efeito de excluir ou alterar o grupo sobre parcelas pagas (FR-025)
      responses:
        '200':
          description: Impacto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupImpact' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transaction-groups/{groupId}/amount-changes:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [Transaction Groups]
      summary: Altera o valor de um lançamento fixo a partir de um mês (FR-020)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromMonth, amount]
              properties:
                fromMonth: { $ref: '#/components/schemas/Month' }
                amount: { $ref: '#/components/schemas/Money' }
      responses:
        '200':
          description: Ocorrências pendentes a partir do mês foram atualizadas
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionGroupDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transaction-groups/{groupId}/end:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [Transaction Groups]
      summary: Encerra um lançamento fixo (FR-020)
      description: "Destrutivo: as ocorrências pendentes depois de `endMonth` são removidas. O cliente deve pedir confirmação."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endMonth]
              properties:
                endMonth:
                  allOf:
                    - $ref: '#/components/schemas/Month'
                  description: Último mês com ocorrência; as pendentes posteriores são removidas
      responses:
        '200':
          description: Encerrado
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionGroupDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # --------------------------------------------------------- Transactions
  /transactions:
    get:
      tags: [Transactions]
      summary: Lista lançamentos com filtros (FR-027)
      description: >-
        Ordenada por vencimento do mais recente ao mais antigo (`dueDate desc, id desc`), em todas as páginas.
      parameters:
        - name: month
          in: query
          description: Mês de vencimento
          schema: { $ref: '#/components/schemas/Month' }
        - name: dateFrom
          in: query
          description: >-
            Vencimento a partir desta data (inclusiva). Se `month` também for enviado, os dois filtros
            valem juntos (E).
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          description: >-
            Vencimento até esta data (inclusiva). `dateFrom` posterior a `dateTo` ou data malformada
            respondem `400`.
          schema: { type: string, format: date }
        - name: accountId
          in: query
          schema: { type: integer, format: int64 }
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/CategoryType' }
        - name: recurrenceType
          in: query
          schema: { $ref: '#/components/schemas/RecurrenceType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TransactionStatus' }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Página de lançamentos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      tags: [Transactions]
      summary: Consulta um lançamento
      responses:
        '200':
          description: Lançamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Transactions]
      summary: Edita valor ou vencimento de uma ocorrência (FR-025)
      description: |
        Despesa: só ocorrências pendentes (paga responde `409`). Receita (fora do cartão): também
        a já recebida. O status só é reavaliado quando o `dueDate` muda: novo `dueDate` hoje ou
        anterior fica `PAID` (com `paymentDate` = novo `dueDate`) e `dueDate` futuro fica `PENDING`.
        Editar só o valor não altera `status` nem `paymentDate`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionPatch' }
      responses:
        '200':
          description: Atualizado
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transactions/{transactionId}/pay:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags: [Transactions]
      summary: Marca o lançamento como pago (FR-019)
      description: |
        Em receita, só vale para receita futura (antecipação do recebimento). Receita com vencimento
        hoje ou anterior já entra paga automaticamente. Lançamento já pago responde `409`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentDate]
              properties:
                paymentDate: { type: string, format: date }
      responses:
        '200':
          description: Pago
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transactions/{transactionId}/unpay:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags: [Transactions]
      summary: Reverte o pagamento do lançamento (FR-019)
      description: |
        Em receita, só vale para receita futura antecipada (volta a `PENDING`). Receita com
        vencimento hoje ou anterior responde `409`: para corrigir, edite ou exclua o lançamento.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Voltou para pendente
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------- Invoices
  /accounts/{accountId}/invoices/{month}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/MonthPath'
    get:
      tags: [Invoices]
      summary: Consulta uma fatura de cartão com itens, pagos e restante (FR-028, FR-035)
      responses:
        '200':
          description: Fatura
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{accountId}/invoices/{month}/payments:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/MonthPath'
    post:
      tags: [Invoices]
      summary: Registra pagamento total ou parcial da fatura (FR-034 a FR-038)
      description: |
        Valor deve ser > 0 e ≤ restante. Se o restante chegar a zero, todos os itens
        pendentes passam a pagos (FR-036). Acima do restante: `409 INVOICE_BALANCE_VIOLATION`. Cartão inativo ainda aceita pagamento.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoicePaymentInput' }
      responses:
        '201':
          description: Pagamento registrado; retorna a fatura atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /accounts/{accountId}/invoices/{month}/payments/settle:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/MonthPath'
    post:
      tags: [Invoices]
      summary: Paga a fatura pelo saldo restante total (FR-037)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paidAt]
              properties:
                paidAt: { type: string, format: date }
      responses:
        '201':
          description: Fatura quitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invoice-payments/{paymentId}:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Invoices]
      summary: Desfaz um pagamento de fatura (FR-037)
      description: "Destrutivo (o cliente deve pedir confirmação, exceto no desfazer imediato após o pagamento). Itens quitados automaticamente voltam a pendentes; itens pagos individualmente permanecem pagos."
      responses:
        '200':
          description: Fatura atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoices/projection:
    get:
      tags: [Invoices]
      summary: Projeção de faturas futuras por cartão (FR-028)
      parameters:
        - name: from
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Month' }
        - name: months
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 12 }
        - name: accountId
          in: query
          description: Restringe a um cartão
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Totais por cartão e mês
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceProjection' }

  # ---------------------------------------------------------- Transfers
  /transfers:
    get:
      tags: [Transfers]
      summary: Lista as transferências entre contas de um mês
      description: |
        Transferências com `transferDate` no mês, da mais recente para a mais antiga. Com `accountId`,
        só as que têm a conta como origem **ou** destino. Traz apenas ids de conta (sem nomes). Não
        confunda com lançamentos: transferências não são receita nem despesa e não aparecem em
        `/transactions`.
      parameters:
        - name: month
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Month' }
        - name: accountId
          in: query
          schema: { type: integer, format: int64 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Página de transferências
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Transfers]
      summary: Transfere saldo entre duas contas
      description: |
        Origem e destino devem ser contas `CHECKING` ou `CASH`, ativas, do usuário e diferentes entre
        si. Cartão de crédito responde `422` no campo `fromAccountId`/`toAccountId` (pagar fatura é
        outro fluxo); conta inativa, `422` `ACCOUNT_INACTIVE`; origem = destino, `422` no campo
        `toAccountId`; conta inexistente ou de outro usuário, `404` com a mesma mensagem. O saldo
        insuficiente é permitido (como nas despesas). A data pode ser passada, hoje ou futura: o saldo
        de `GET /balances` só considera transferências com data até hoje. Exige conexão no aplicativo
        (não entra na fila offline).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInput' }
      responses:
        '201':
          description: Transferência registrada
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transfers/{transferId}:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    get:
      tags: [Transfers]
      summary: Consulta uma transferência
      responses:
        '200':
          description: Transferência
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Transfers]
      summary: Edita uma transferência (substituição completa)
      description: |
        Mesmas regras da criação, inclusive conta inativa (`422`) nas duas pontas. `version`
        desatualizada responde `409` (`STALE_VERSION`). Exige conexão no aplicativo.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferUpdate' }
      responses:
        '200':
          description: Atualizada
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Transfers]
      summary: Exclui (estorna) uma transferência
      description: |
        O saldo das duas contas volta ao que era. Permitido mesmo quando uma das contas está inativa.
        Destrutivo: o cliente deve pedir confirmação. Exige conexão no aplicativo.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Excluída
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------ Dashboard
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Indicadores e gráficos do mês, por vencimento (FR-030, FR-031)
      parameters:
        - name: month
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Month' }
      responses:
        '200':
          description: Painel do mês
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }

  /balances:
    get:
      tags: [Dashboard]
      summary: Saldo por conta e total, acumulado até hoje
      description: |
        Para cada conta `CHECKING` ou `CASH` (ativas e inativas): saldo inicial + receitas recebidas
        (`PAID` com pagamento até hoje) − despesas pagas da própria conta − saídas dos cartões vinculados
        (despesas de cartão pagas individualmente e pagamentos de fatura com data até hoje) +
        transferências recebidas − transferências enviadas (`/transfers` com data até hoje; transferência
        de data futura só conta a partir dela). Uma transferência entre contas ativas não altera o `total`.
        A lista traz todas as contas com o saldo real e a flag `active`, mas o `total` soma apenas as
        contas ativas: conta inativa não entra no Saldo Geral, mesmo com saldo.
        Saídas de cartão sem conta vinculada não debitam nenhuma conta e somam em `unlinkedCardPayments`.
        Itens de cartão quitados por pagamento de fatura não são contados de novo.
      responses:
        '200':
          description: Saldos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balances' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cashflow:
    get:
      tags: [Dashboard]
      summary: Saldo residual por mês = receitas previstas − despesas previstas (FR-029)
      parameters:
        - name: from
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Month' }
        - name: months
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 12 }
      responses:
        '200':
          description: Fluxo de caixa mensal
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CashflowMonth' }

  /due-summary:
    get:
      tags: [Dashboard]
      summary: Contagem de vencimentos por dia para os lembretes do aplicativo
      description: |
        Itens pendentes fora de cartão e faturas de cartão com saldo restante, por data de vencimento
        no período `from`..`to` (até 62 dias), mais o que está atrasado (vencimento antes de hoje).
        Nunca traz valores, descrições nem nomes. O aplicativo consulta a partir de hoje.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Vencimentos do período e atrasados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DueSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClientHeader:
      name: X-Client
      in: header
      description: "`web` entrega o refresh token em cookie HttpOnly; ausente (mobile) entrega no corpo"
      schema: { type: string, enum: [web] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUID gerado pelo cliente (operações feitas offline no aplicativo: criar, pagar, desfazer, editar e
        excluir lançamentos, alterar valor e encerrar; criar, editar e excluir transferências). A query string (ex.:
        `confirm=true`) não conta na identidade. Repetir a mesma chave, com o
        mesmo caminho e corpo, devolve a resposta original com `Idempotent-Replayed: true` sem repetir
        o efeito. Chave em processamento responde `409` (`IDEMPOTENCY_IN_PROGRESS`); chave usada com
        outro caminho ou corpo responde `422` (`IDEMPOTENCY_KEY_REUSED`); chave que não é UUID, `400`.
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MonthPath:
      name: month
      in: path
      required: true
      description: Mês do vencimento da fatura
      schema: { $ref: '#/components/schemas/Month' }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    InvitationToken:
      name: token
      in: path
      required: true
      description: Token do link do convite (chega só por e-mail)
      schema: { type: string }
    ReasonId:
      name: reasonId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PendingId:
      name: pendingId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `nextCursor` da página anterior
      schema: { type: string }
    CursorLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  headers:
    IdempotentReplayed:
      description: "`true` quando a resposta é a original guardada para a chave de idempotência"
      schema: { type: string, enum: ['true'] }

  responses:
    BadRequest:
      description: Requisição inválida (período, cabeçalho ou parâmetro malformado)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Credenciais ausentes, inválidas ou expiradas
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso inexistente ou de outro usuário
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflito de regra de negócio ou versão desatualizada (`STALE_VERSION`, `INVOICE_BALANCE_VIOLATION`, …)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Dados inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    TooManyRequests:
      description: Limite de solicitações excedido
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        Acesso negado ou regra de negócio recusada: usuário sem papel administrador, `ROOT_PROTECTED`,
        `REAUTH_FAILED`, `ACCOUNT_SUSPENDED`, `ADMIN_DECISION_LOCKED` ou `SIGNUPS_CLOSED`. Recusas de
        regra nunca usam `401`, que fica reservado a "não autenticado ou sessão expirada".
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Convite expirado ou cancelado (`INVITATION_EXPIRED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: O envio de e-mail de que a ação depende falhou; nada foi concluído (`MAIL_DELIVERY_FAILED`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Sistema em manutenção para usuários comuns (`MAINTENANCE`), com a mensagem em `message`
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/MaintenanceProblem' }

  schemas:
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: '1234.56'
    Month:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: '2026-11'
    AccountType:
      type: string
      enum: [CHECKING, CASH, CREDIT_CARD]
    HolderType:
      type: string
      enum: [PF, PJ]
      description: "Titularidade da conta bancária: pessoa física ou jurídica (classificação, sem separar dados)."
    AccountIcon:
      type: string
      enum: [bank, building, briefcase, landmark, wallet, cash, piggy, card, card-gold, card-platinum, card-black, shield, rocket, star, globe, shopping-bag]
    CategoryType:
      type: string
      enum: [INCOME, EXPENSE]
    RecurrenceType:
      type: string
      enum: [FIXED, VARIABLE, INSTALLMENT]
    TransactionStatus:
      type: string
      enum: [PENDING, PAID]

    DueSummary:
      type: object
      required: [days, overdue]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, items, invoices]
            properties:
              date: { type: string, format: date }
              items: { type: integer, minimum: 0 }
              invoices: { type: integer, minimum: 0 }
        overdue:
          type: object
          required: [items, invoices]
          properties:
            items: { type: integer, minimum: 0 }
            invoices: { type: integer, minimum: 0 }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type: { type: string }
        instance: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Código estável legível por máquina
          example: INVOICE_BALANCE_VIOLATION
        remainingBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Presente em `INVOICE_BALANCE_VIOLATION`
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          additionalProperties: true
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
    InUseProblem:
      description: "`409` de exclusão bloqueada (`ACCOUNT_IN_USE`, `CATEGORY_IN_USE`) com o que está em uso."
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          additionalProperties: true
          properties:
            transactionCount: { type: integer, format: int64, description: "Lançamentos que usam a conta ou a categoria." }
            groupCount: { type: integer, format: int64, description: "Grupos de lançamento que usam a categoria." }
            invoicePaymentCount: { type: integer, format: int64, description: "Pagamentos de fatura da conta." }
            transferCount: { type: integer, format: int64, description: "Transferências em que a conta é origem ou destino." }
            linkedCardCount: { type: integer, format: int64, description: "Cartões vinculados à conta bancária." }
            hasOpeningBalance: { type: boolean, description: "A conta tem saldo inicial diferente de zero." }
    DeletionPendingProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          additionalProperties: true
          required: [deletionDate]
          properties:
            deletionDate: { type: string, format: date, description: Data limite (`due_at` real da solicitação; o prazo pode variar) }
            origin: { type: string, enum: [USER, ADMIN], description: Quem pediu a exclusão }
            canCancel: { type: boolean, description: Verdadeiro só quando `origin` é `USER`; exclusão de origem administrativa não é revertida pelo usuário }
            reasonMessage: { type: string, description: Mensagem genérica fixada na solicitação (só `ADMIN`); nunca a justificativa }
            supportHint: { type: string, description: Orientação para procurar o suporte }
            notices:
              type: array
              items: { $ref: '#/components/schemas/UserNotice' }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 10, description: 'Mínimo de 10 caracteres e máximo de 72 bytes em UTF-8 (limite do BCrypt), validado no servidor' }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Segundos até expirar (900) }
        refreshToken:
          type: string
          description: Presente apenas fora do modo web
    UserProfile:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: [string, 'null'], description: Nome de exibição; nulo até o usuário informar }
        createdAt: { type: string, format: date-time }
        admin:
          type: boolean
          description: Conveniência de interface (mostrar o painel); a barreira de acesso é sempre do servidor. Ausente em clientes e respostas antigas.
        notices:
          type: array
          description: 'Avisos de entrega única ao usuário (ex.: exclusão cancelada por um administrador).'
          items: { $ref: '#/components/schemas/UserNotice' }

    SystemStatus:
      type: object
      required: [maintenance, signupsOpen]
      properties:
        maintenance: { type: boolean }
        message: { type: string, maxLength: 280, description: Mensagem de manutenção, quando houver }
        signupsOpen: { type: boolean }
    InvitationPreview:
      type: object
      required: [email, expiresAt]
      properties:
        email: { type: string, format: email }
        expiresAt: { type: string, format: date-time }
    AcceptInvitationRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, minLength: 10, description: 'Política de senha existente: mínimo de 10 caracteres e máximo de 72 bytes em UTF-8' }
    UserNotice:
      type: object
      required: [id, kind, variant, message]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [DELETION_CANCELED] }
        variant: { type: string, enum: [ACTIVE, STILL_BLOCKED, USER_REQUEST_CONTINUES] }
        originalDeletionDate: { type: string, format: date }
        message: { type: string, description: Texto pronto em pt-BR; nunca a justificativa do administrador }
    MaintenanceProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          additionalProperties: true
          properties:
            message: { type: string, description: Mensagem de manutenção definida pelo administrador }

    Party:
      type: object
      required: [label]
      properties:
        userId: { type: integer, format: int64 }
        label:
          type: string
          description: |
            E-mail ou nome vivos; `anônimo-` e 8 hexadecimais se a conta foi removida; `visitante` para
            quem não estava autenticado; `sistema` para ações automáticas. Nunca carrega IP: o IP e o
            dispositivo de uma tentativa ficam em `AuditEntry.client`, só no detalhe.
    AdminRole:
      type: string
      enum: [USER, ADMIN, ROOT]
    AdminUserRow:
      type: object
      required: [id, email, createdAt, role, suspended, deletionPending]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastAccessAt: { type: [string, 'null'], format: date-time }
        role: { $ref: '#/components/schemas/AdminRole' }
        suspended: { type: boolean }
        deletionPending: { type: boolean }
    AdminUserCounts:
      type: object
      required: [active, suspended, deletionPending, admin]
      properties:
        active: { type: integer, format: int64, minimum: 0 }
        suspended: { type: integer, format: int64, minimum: 0 }
        deletionPending: { type: integer, format: int64, minimum: 0 }
        admin: { type: integer, format: int64, minimum: 0 }
    AdminUserPage:
      type: object
      required: [content, page, size, totalElements, counts]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AdminUserRow' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        counts: { $ref: '#/components/schemas/AdminUserCounts' }
    AdminLoginLock:
      type: object
      required: [lockedUntil]
      properties:
        lockedUntil: { type: string, format: date-time }
    AdminDeletionInfo:
      type: object
      required: [origin, requestedAt, dueAt]
      properties:
        origin: { type: string, enum: [USER, ADMIN] }
        requestedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        reasonName: { type: string }
        noticeState: { type: string, enum: [NOT_APPLICABLE, QUEUED, SENT, PENDING, DISCARDED, EXPIRED] }
    PendingEmailChange:
      type: object
      required: [newEmail, expiresAt, attemptsLeft]
      properties:
        newEmail: { type: string, format: email }
        expiresAt: { type: string, format: date-time }
        attemptsLeft: { type: integer, minimum: 0, maximum: 5 }
    AdminUserDetail:
      description: |
        Nunca inclui contas, cartões, lançamentos, categorias, transferências, saldos nem contagens deles.
        Os campos da conta repetem `AdminUserRow` (o validador de contrato rejeita `allOf` com objetos
        sem `additionalProperties`, então o esquema é plano).
      type: object
      required: [id, email, createdAt, role, suspended, deletionPending, openSessions, protected, recentActions]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastAccessAt: { type: [string, 'null'], format: date-time }
        role: { $ref: '#/components/schemas/AdminRole' }
        suspended: { type: boolean }
        deletionPending: { type: boolean }
        openSessions: { type: integer, minimum: 0 }
        loginLock: { $ref: '#/components/schemas/AdminLoginLock' }
        deletion: { $ref: '#/components/schemas/AdminDeletionInfo' }
        pendingEmailChange: { $ref: '#/components/schemas/PendingEmailChange' }
        protected: { type: boolean, description: Verdadeiro para o administrador raiz }
        recentActions:
          type: array
          description: Últimas 20 ações sobre o usuário
          items: { $ref: '#/components/schemas/AuditEntry' }
    AdminSession:
      type: object
      required: [id, startedAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        ip: { type: string, description: Dado pessoal; ausente em sessões anteriores à feature }
        device: { type: string, description: 'Rótulo grosseiro (ex.: "Chrome em Windows"), nunca o User-Agent bruto' }
        current: { type: boolean }
    AdminRenameRequest:
      type: object
      required: [name]
      properties:
        name: { type: [string, 'null'], maxLength: 80 }
    SuspendRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, description: Justificativa guardada só na auditoria }
    RoleChangeRequest:
      type: object
      required: [role, password]
      properties:
        role: { type: string, enum: [USER, ADMIN] }
        password: { type: string, format: password, description: Senha do próprio administrador }
    ForcePasswordResetRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password, description: Senha do próprio administrador }
    EmailChangeRequest:
      type: object
      required: [newEmail]
      properties:
        newEmail: { type: string, format: email, maxLength: 254 }
    EmailChangeConfirmRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^\d{6}$' }
    DeletionRequest:
      type: object
      required: [reasonId, justification, mode, confirmEmail, password]
      properties:
        reasonId: { type: integer, format: int64 }
        justification: { type: string, minLength: 1, maxLength: 1000, description: Guardada só na auditoria; nunca mostrada ao usuário }
        mode: { type: string, enum: [IMMEDIATE, GRACE] }
        days: { type: integer, minimum: 1, maximum: 30, description: Obrigatório em `GRACE` }
        confirmEmail: { type: string, format: email, description: E-mail do alvo, digitado pelo administrador }
        password: { type: string, format: password, description: Senha do próprio administrador }
    DeletionOutcome:
      type: object
      required: [status, noticeState]
      properties:
        status: { type: string, enum: [SCHEDULED, EXECUTED, SUPERSEDED] }
        dueAt: { type: string, format: date-time }
        noticeState: { type: string, enum: [SENT, PENDING] }

    AuditAction:
      type: string
      enum:
        - USER_DETAIL_OPENED
        - USER_SUSPENDED
        - USER_REACTIVATED
        - LOGIN_LOCK_CLEARED
        - SESSION_REVOKED
        - SESSIONS_REVOKED_ALL
        - SYSTEM_SESSIONS_REVOKED
        - PASSWORD_RESET_SENT
        - PASSWORD_RESET_FORCED
        - USER_RENAMED
        - EMAIL_CHANGE_REQUESTED
        - EMAIL_CHANGE_CONFIRMED
        - EMAIL_CHANGE_FAILED
        - EMAIL_CHANGE_CANCELED
        - ROLE_GRANTED
        - ROLE_REVOKED
        - DELETION_REQUESTED
        - DELETION_ANTICIPATED
        - DELETION_CANCELED
        - ACCOUNT_ERASED
        - COMMUNICATION_RESENT
        - COMMUNICATION_DISCARDED
        - EMAIL_TEST_SENT
        - INVITATION_CREATED
        - INVITATION_RESENT
        - INVITATION_CANCELED
        - REASON_CREATED
        - REASON_UPDATED
        - REASON_DEACTIVATED
        - REASON_ACTIVATED
        - PARAMETER_CHANGED
        - ACCESS_DENIED
        - REVERT_ATTEMPT
    AuditResult:
      type: string
      enum: [SUCCESS, REFUSED, FAILED]
    AuditEntry:
      type: object
      required: [id, occurredAt, action, result, actor, summary]
      properties:
        id: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time }
        action: { $ref: '#/components/schemas/AuditAction' }
        result: { $ref: '#/components/schemas/AuditResult' }
        actor: { $ref: '#/components/schemas/Party' }
        target: { $ref: '#/components/schemas/Party' }
        subject: { type: string, description: 'Alvo que não é usuário: parâmetro, motivo, convite, comunicação ou rota negada' }
        reason: { type: string, description: Justificativa informada pelo administrador }
        refusalCode: { type: string }
        summary: { type: string, description: Resumo em pt-BR }
        details: { type: object, additionalProperties: true, description: Resumo estruturado; nunca senha, token, link, código, e-mail, nome, IP nem valor financeiro }
        client: { $ref: '#/components/schemas/AuditClient' }
    AuditClient:
      type: object
      description: |
        Origem de uma tentativa (acesso negado, recusa de reautenticação ou de reverter decisão). Só vem
        em `GET /admin/audit/{auditId}`, nunca na lista nem no histórico do usuário.
      required: [ref]
      properties:
        ref:
          type: string
          description: |
            Identificador anônimo e estável do IP (`anônimo-` e 8 hexadecimais): tentativas do mesmo IP
            têm o mesmo `ref`, mesmo depois de o IP ser apagado. Não é reversível.
        ip:
          type: string
          description: |
            IP real. Presente só no detalhe e só enquanto existir: apagado com a exclusão da conta e,
            para visitantes sem conta, depois de 90 dias.
        device: { type: string, description: 'Rótulo grosseiro do dispositivo (navegador e sistema); some junto com o IP' }
    AuditPage:
      type: object
      required: [content]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        nextCursor: { type: string, description: Ausente na última página }

    SystemHealth:
      type: object
      required: [app, database, version, uptimeSeconds, readAt]
      properties:
        app: { type: string, enum: [UP, DOWN] }
        database: { type: string, enum: [UP, DOWN] }
        version: { type: string }
        uptimeSeconds: { type: integer, format: int64, minimum: 0 }
        readAt: { type: string, format: date-time }
    DayCount:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer, format: int64, minimum: 0 }
    UsageStats:
      description: Somente contagens; nada por usuário.
      type: object
      required: [readAt, usersByStatus, active7d, active30d, newUsersByDay, entriesCreatedByDay]
      properties:
        readAt: { type: string, format: date-time }
        usersByStatus: { $ref: '#/components/schemas/AdminUserCounts' }
        active7d: { type: integer, format: int64, minimum: 0 }
        active30d: { type: integer, format: int64, minimum: 0 }
        newUsersByDay:
          type: array
          items: { $ref: '#/components/schemas/DayCount' }
        entriesCreatedByDay:
          type: array
          items: { $ref: '#/components/schemas/DayCount' }
    AdminAlerts:
      type: object
      required: [pendingCommunications]
      properties:
        pendingCommunications: { type: integer, minimum: 0 }

    EmailKind:
      type: string
      enum: [PASSWORD_RESET, TEST, INVITATION, DELETION_NOTICE, CANCELLATION_NOTICE, EMAIL_CHANGE_CODE, EMAIL_CHANGE_NOTICE]
    EmailFailureReason:
      type: string
      enum: [AUTHENTICATION, PERMANENT_REJECTION, TRANSIENT_EXHAUSTED, TIMEOUT, NOT_CONFIGURED, OTHER]
    EmailConfig:
      description: Nunca inclui usuário nem senha do servidor de e-mail.
      type: object
      required: [host, port, from, complete, authEnabled, starttls]
      properties:
        host: { type: string }
        port: { type: integer }
        from: { type: string }
        complete: { type: boolean }
        authEnabled: { type: boolean }
        starttls: { type: boolean }
    EmailTestResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [SENT, FAILED] }
        failureReason: { $ref: '#/components/schemas/EmailFailureReason' }
    EmailDelivery:
      type: object
      required: [id, createdAt, kind, recipient, status]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/EmailKind' }
        recipient: { $ref: '#/components/schemas/Party' }
        status: { type: string, enum: [SENT, FAILED] }
        failureReason: { $ref: '#/components/schemas/EmailFailureReason' }
    EmailDeliveryPage:
      type: object
      required: [content]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/EmailDelivery' }
        nextCursor: { type: string, description: Ausente na última página }
    PendingCommunication:
      type: object
      required: [id, kind, targetLabel, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [DELETION_NOTICE, CANCELLATION_NOTICE] }
        targetLabel: { type: string, description: 'Rótulo anônimo (ex.: "anônimo-1a2b3c4d")' }
        failureReason: { $ref: '#/components/schemas/EmailFailureReason' }
        attempts: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        retainedUntil: { type: string, format: date-time }
    ResendResult:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [DELIVERED, PENDING] }

    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, CANCELED, EXPIRED]
    InvitationRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    Invitation:
      type: object
      required: [id, status, invitedBy, createdAt, expiresAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email, description: Somente enquanto `PENDING` }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        invitedBy: { $ref: '#/components/schemas/Party' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    DeletionReason:
      type: object
      required: [id, name, message, active, initial]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 80 }
        message: { type: string, maxLength: 500, description: Mensagem genérica mostrada ao usuário }
        active: { type: boolean }
        initial: { type: boolean }
    DeletionReasonInput:
      type: object
      required: [name, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        message: { type: string, minLength: 1, maxLength: 500, description: 'Genérica: sem e-mail, URL, sequência de 8 ou mais dígitos nem marcador de substituição' }
    EditableParameter:
      type: object
      required: [key, value, updatedAt]
      properties:
        key: { type: string, enum: [SIGNUPS_OPEN, MAINTENANCE_ENABLED, MAINTENANCE_MESSAGE] }
        value: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/Party' }
    ReadOnlyParameter:
      type: object
      required: [key, value, label]
      properties:
        key: { type: string }
        value: { type: string }
        label: { type: string }
    Parameters:
      type: object
      required: [editable, readOnly]
      properties:
        editable:
          type: array
          items: { $ref: '#/components/schemas/EditableParameter' }
        readOnly:
          type: array
          items: { $ref: '#/components/schemas/ReadOnlyParameter' }
    SignupsOpenRequest:
      type: object
      required: [open]
      properties:
        open: { type: boolean }
    MaintenanceRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        message: { type: string, maxLength: 280 }
    RevokeAllRequest:
      type: object
      required: [password, confirmWord]
      properties:
        password: { type: string, format: password }
        confirmWord: { type: string, enum: [ENCERRAR] }
    RevokeAllResult:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer, format: int64, minimum: 0 }

    Account:
      type: object
      required: [id, name, type, active, version, openingBalance]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        holderType:
          $ref: '#/components/schemas/HolderType'
          description: "Em conta bancária, o titular; em cartão, o titular herdado da conta vinculada (ausente se o cartão não tem vínculo)."
        icon:
          $ref: '#/components/schemas/AccountIcon'
          description: "Sempre presente: o escolhido ou o padrão do tipo."
        bankAccountId: { type: integer, format: int64, description: "Somente em cartão vinculado." }
        bankAccountName: { type: string, description: "Nome da conta bancária do cartão." }
        colorHex:
          type: string
          pattern: '^#[0-9A-F]{6}$'
          description: "Cor personalizada do ícone, em maiúsculas. Ausente quando a conta usa o visual padrão do tipo."
        openingBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: "Saldo inicial da conta (parte do saldo de `GET /balances`). Sempre devolvido; `0.00` quando nunca informado e sempre `0.00` em cartão de crédito."
        active: { type: boolean }
        version: { type: integer, format: int64 }
    AccountInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        type: { $ref: '#/components/schemas/AccountType' }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        holderType: { $ref: '#/components/schemas/HolderType' }
        icon: { $ref: '#/components/schemas/AccountIcon' }
        bankAccountId: { type: integer, format: int64 }
        colorHex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: "Cor personalizada do ícone (`#RRGGBB`; o servidor guarda em maiúsculas). Opcional: ausente usa o visual padrão do tipo. Texto vazio ou fora do formato responde `422` com erro no campo `colorHex`."
        openingBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: "Saldo inicial da conta, pode ser negativo. Opcional: ausente vale `0.00`. Valor diferente de zero em CREDIT_CARD responde `422` com erro no campo `openingBalance`."
      description: "`closingDay` e `dueDay` são obrigatórios para CREDIT_CARD e proibidos nos demais tipos. `holderType` é obrigatório em CHECKING e proibido nos demais. `bankAccountId` (conta bancária ativa do mesmo usuário) é obrigatório em CREDIT_CARD e proibido nos demais; conta de outro usuário responde 404 e conta inativa, 422 ACCOUNT_INACTIVE. `icon` ausente usa o padrão do tipo."
    AccountUpdate:
      type: object
      required: [name, type, active, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        type: { $ref: '#/components/schemas/AccountType' }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        holderType: { $ref: '#/components/schemas/HolderType' }
        icon: { $ref: '#/components/schemas/AccountIcon' }
        bankAccountId: { type: integer, format: int64 }
        colorHex:
          type: string
          pattern: '^(#[0-9A-Fa-f]{6})?$'
          description: "Cor personalizada do ícone (`#RRGGBB`; o servidor guarda em maiúsculas). Ausente mantém a cor atual (assim um cliente antigo não apaga cores); a string vazia `\"\"` remove a cor e volta ao visual padrão do tipo. Formato inválido responde `422` com erro no campo `colorHex`."
        openingBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: "Saldo inicial da conta. Opcional: ausente mantém o valor atual. Valor diferente de zero em CREDIT_CARD responde `422` com erro no campo `openingBalance`."
        active: { type: boolean }
        version: { type: integer, format: int64 }
      description: "O tipo não pode ser alterado depois do cadastro; os demais campos seguem as regras de AccountInput. Cartão anterior ao vínculo (sem `bankAccountId`) precisa informá-lo ao ser editado, exceto quando só `active` muda."
    AccountUsage:
      type: object
      required: [canDelete, transactionCount, invoicePaymentCount, linkedCards, openingBalance]
      description: "Prévia da exclusão. `canDelete` é verdadeiro só sem lançamentos, pagamentos de fatura, transferências, cartões vinculados e saldo inicial."
      properties:
        canDelete: { type: boolean }
        transactionCount: { type: integer, format: int64 }
        invoicePaymentCount: { type: integer, format: int64 }
        transferCount: { type: integer, format: int64, description: "Transferências em que a conta é origem ou destino. Campo aditivo: cópias antigas podem não trazê-lo (trate como 0)." }
        linkedCards:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
        openingBalance: { $ref: '#/components/schemas/Money' }

    Category:
      type: object
      required: [id, name, type, colorHex]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/CategoryType' }
        colorHex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    CategoryUsage:
      type: object
      required: [canDelete, transactionCount, groupCount]
      properties:
        canDelete: { type: boolean }
        transactionCount: { type: integer, format: int64 }
        groupCount: { type: integer, format: int64 }
    CategoryInput:
      type: object
      required: [name, type, colorHex]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: '#/components/schemas/CategoryType' }
        colorHex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }

    TransactionGroupInput:
      type: object
      required: [description, recurrenceType, totalAmount, accountId, categoryId, purchaseDate]
      properties:
        description: { type: string, minLength: 1, maxLength: 120 }
        recurrenceType: { $ref: '#/components/schemas/RecurrenceType' }
        totalAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Valor total (INSTALLMENT), valor mensal (FIXED) ou valor único (VARIABLE)
        totalInstallments:
          type: integer
          minimum: 1
          maximum: 120
          description: Obrigatório para INSTALLMENT (1 vira um avulso; até 120); nos demais tipos é 1 e pode ser omitido
        accountId:
          type: integer
          format: int64
          description: >-
            Receita (categoria `INCOME`) só pode entrar em conta `CHECKING` ou `CASH`: em conta do tipo
            `CREDIT_CARD` responde `422` com erro no campo `accountId`
            ("Receitas só podem entrar em conta bancária ou dinheiro, não em cartão de crédito.").
        categoryId: { type: integer, format: int64 }
        purchaseDate: { type: string, format: date }
        firstDueDate:
          type: string
          format: date
          description: >-
            Obrigatório fora do cartão de crédito; ignorado em cartão (calculado pelo servidor). Para receita,
            é a data em que o dinheiro entra na conta: data de hoje ou anterior entra automaticamente
            (`PAID`); data futura fica `PENDING` até a data chegar.
        payNow:
          type: boolean
          description: >-
            "Pagar agora": a ocorrência é criada já `PAID`, com `paymentDate` igual ao vencimento
            (`firstDueDate`), na mesma requisição. Vale só para despesa avulsa (`VARIABLE`, ou `INSTALLMENT`
            com 1 parcela) em conta `CHECKING` ou `CASH`, com vencimento de hoje ou anterior. Em cartão de
            crédito, receita, `FIXED`, `INSTALLMENT` com 2+ parcelas ou vencimento futuro, `true` responde
            `422` com erro no campo `payNow` e nada é gravado. Omitido equivale a `false`.
    TransactionGroupUpdate:
      type: object
      required: [description, categoryId, version]
      properties:
        description: { type: string, minLength: 1, maxLength: 120 }
        categoryId: { type: integer, format: int64 }
        version: { type: integer, format: int64 }
    TransactionGroupDetail:
      type: object
      required: [id, description, recurrenceType, totalInstallments, totalAmount, accountId, categoryId, purchaseDate, version, transactions]
      properties:
        id: { type: integer, format: int64 }
        description: { type: string }
        recurrenceType: { $ref: '#/components/schemas/RecurrenceType' }
        totalInstallments: { type: integer }
        totalAmount: { $ref: '#/components/schemas/Money' }
        accountId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        purchaseDate: { type: string, format: date }
        endMonth: { $ref: '#/components/schemas/Month' }
        version: { type: integer, format: int64 }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
    GroupImpact:
      type: object
      required: [paidCount, pendingCount, paidAmount, pendingAmount]
      properties:
        paidCount: { type: integer }
        pendingCount: { type: integer }
        paidAmount: { $ref: '#/components/schemas/Money' }
        pendingAmount: { $ref: '#/components/schemas/Money' }

    Transaction:
      type: object
      required: [id, groupId, accountId, categoryId, description, installmentNumber, totalInstallments, amount, dueDate, status, overdue, version]
      properties:
        id: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }
        accountId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        description: { type: string }
        recurrenceType: { $ref: '#/components/schemas/RecurrenceType' }
        installmentNumber: { type: integer }
        totalInstallments: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
        dueDate: { type: string, format: date }
        paymentDate: { type: string, format: date }
        status:
          allOf:
            - $ref: '#/components/schemas/TransactionStatus'
          description: >-
            Em receita, `PAID` automático quando `dueDate` é hoje ou anterior (o servidor liquida na
            consulta, com `paymentDate` igual a `dueDate`); receita futura fica `PENDING` até a data
            chegar, a menos que seja antecipada pela ação `pay`.
        settledByInvoicePayment:
          type: boolean
          description: Verdadeiro se foi marcado como pago pela quitação da fatura
        overdue:
          type: boolean
          description: Despesa pendente com vencimento anterior a hoje. Em receita é sempre `false` (receita nunca fica atrasada).
        version: { type: integer, format: int64 }
    TransactionPatch:
      type: object
      required: [version]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        dueDate: { type: string, format: date }
        version: { type: integer, format: int64 }
    TransactionPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }

    Transfer:
      type: object
      required: [id, fromAccountId, toAccountId, amount, transferDate, scheduled, version]
      properties:
        id: { type: integer, format: int64 }
        fromAccountId: { type: integer, format: int64 }
        toAccountId: { type: integer, format: int64 }
        amount: { $ref: '#/components/schemas/Money' }
        transferDate: { type: string, format: date }
        description: { type: string, maxLength: 120, description: "Ausente quando não informada." }
        scheduled:
          type: boolean
          description: "Verdadeiro quando `transferDate` é futura: o saldo só a considera a partir dessa data."
        version: { type: integer, format: int64 }
    TransferInput:
      type: object
      required: [fromAccountId, toAccountId, amount, transferDate]
      properties:
        fromAccountId: { type: integer, format: int64, description: "Conta de origem (`CHECKING` ou `CASH`, ativa)." }
        toAccountId: { type: integer, format: int64, description: "Conta de destino (`CHECKING` ou `CASH`, ativa), diferente da origem." }
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: "Maior que zero, até 15 dígitos inteiros."
        transferDate: { type: string, format: date, description: "Passada, hoje ou futura, com ano de 1900 a 2200 (`1900-01-01` a `2200-12-31`); fora disso, `422` no campo `transferDate`." }
        description: { type: string, maxLength: 120, description: "Opcional; o servidor apara os espaços e texto vazio vira ausente." }
    TransferUpdate:
      type: object
      required: [fromAccountId, toAccountId, amount, transferDate, version]
      properties:
        fromAccountId: { type: integer, format: int64 }
        toAccountId: { type: integer, format: int64 }
        amount: { $ref: '#/components/schemas/Money' }
        transferDate: { type: string, format: date, description: "Entre `1900-01-01` e `2200-12-31`." }
        description: { type: string, maxLength: 120 }
        version: { type: integer, format: int64 }
      description: "Substituição completa; mesmas regras de TransferInput."
    TransferPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Transfer' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }

    Invoice:
      type: object
      required: [accountId, month, dueDate, total, paidIndividually, paidByInvoicePayments, remaining, items, payments]
      properties:
        accountId: { type: integer, format: int64 }
        month: { $ref: '#/components/schemas/Month' }
        dueDate:
          type: string
          format: date
          description: Vencimento mais recente entre os itens da fatura (pode haver mais de um após mudança dos dias do cartão)
        total: { $ref: '#/components/schemas/Money' }
        paidIndividually: { $ref: '#/components/schemas/Money' }
        paidByInvoicePayments: { $ref: '#/components/schemas/Money' }
        remaining:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: total − paidIndividually − paidByInvoicePayments (nunca negativo)
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/InvoicePayment' }
    InvoicePayment:
      type: object
      required: [id, amount, paidAt]
      properties:
        id: { type: integer, format: int64 }
        amount: { $ref: '#/components/schemas/Money' }
        paidAt: { type: string, format: date }
    InvoicePaymentInput:
      type: object
      required: [amount, paidAt]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        paidAt: { type: string, format: date }
    InvoiceProjection:
      type: object
      required: [months, cards]
      properties:
        months:
          type: array
          items: { $ref: '#/components/schemas/Month' }
        cards:
          type: array
          items:
            type: object
            required: [accountId, name, invoices, totalCommitted]
            properties:
              accountId: { type: integer, format: int64 }
              name: { type: string }
              totalCommitted:
                allOf:
                  - $ref: '#/components/schemas/Money'
                description: Soma do restante das faturas do intervalo
              invoices:
                type: array
                items:
                  type: object
                  required: [month, total, remaining]
                  properties:
                    month: { $ref: '#/components/schemas/Month' }
                    total: { $ref: '#/components/schemas/Money' }
                    remaining: { $ref: '#/components/schemas/Money' }

    Dashboard:
      type: object
      required: [month, totalMonth, totalToDue, totalPaid, overdueTotal, totalIncome, totalReceived, byCategory, byCard]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        totalMonth:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Despesas com vencimento no mês
        totalToDue:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Restante ainda não vencido do mês (faturas de cartão pelo restante da fatura; demais itens pelo valor pendente)
        totalPaid:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >-
            Soma de itens com vencimento no mês marcados como pagos individualmente (sem `settledByInvoicePayment`)
            mais os pagamentos de fatura cuja fatura vence no mês. Itens quitados por pagamento de fatura
            não são somados de novo.
        overdueTotal: { $ref: '#/components/schemas/Money' }
        totalIncome:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Receitas com vencimento no mês (recebidas ou não)
        totalReceived:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Parte das receitas do mês que já entrou na conta (receita com vencimento até hoje ou antecipada)
        byCategory:
          type: array
          items:
            type: object
            required: [categoryId, name, colorHex, amount]
            properties:
              categoryId: { type: integer, format: int64 }
              name: { type: string }
              colorHex: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
        byCard:
          type: array
          items:
            type: object
            required: [accountId, name, amount]
            properties:
              accountId: { type: integer, format: int64 }
              name: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
    AccountBalance:
      type: object
      required: [accountId, name, type, active, balance, openingBalance]
      properties:
        accountId: { type: integer, format: int64 }
        name: { type: string }
        type:
          type: string
          enum: [CHECKING, CASH]
        active: { type: boolean, description: 'Conta inativa não entra em `Balances.total` e o painel não a exibe' }
        balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Saldo acumulado até hoje (pode ser negativo)
        openingBalance: { $ref: '#/components/schemas/Money' }
    Balances:
      type: object
      required: [asOf, total, accounts, unlinkedCardPayments]
      properties:
        asOf: { type: string, format: date, description: Data de referência do saldo (hoje, no fuso do servidor) }
        total:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Soma dos saldos das contas ativas. Contas inativas aparecem em `accounts` com `active=false` e saldo real, mas não entram no total.
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountBalance' }
        unlinkedCardPayments:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Saídas de cartões sem conta vinculada, que não debitam nenhuma conta
    CashflowMonth:
      type: object
      required: [month, expectedIncome, expectedExpense, residual]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        expectedIncome: { $ref: '#/components/schemas/Money' }
        expectedExpense: { $ref: '#/components/schemas/Money' }
        residual:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: expectedIncome − expectedExpense (pode ser negativo)
