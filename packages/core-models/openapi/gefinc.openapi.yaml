openapi: 3.1.0
info:
  title: GEFINC API
  version: 1.0.0
  description: |
    Contrato da API REST do GEFINC (gestão financeira pessoal).

    Convenções:
    - Valores monetários são **strings decimais** com 2 casas (`"1234.56"`), nunca números JSON.
    - Datas de negócio usam `YYYY-MM-DD`; meses usam `YYYY-MM`.
    - Erros seguem RFC 7807 (`application/problem+json`) com o campo estável `code`.
    - Todo recurso pertence ao usuário do token; recurso de outro usuário responde `404`.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Accounts
  - name: Categories
  - name: Transaction Groups
  - name: Transactions
  - name: Invoices
  - name: Dashboard

paths:
  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Cria uma conta (FR-001)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica o usuário (FR-002)
      description: |
        Com o cabeçalho `X-Client: web`, o refresh token é entregue em cookie
        `HttpOnly; Secure; SameSite=Strict` e omitido do corpo. Sem ele (mobile), vem no corpo.
        Conta com exclusão pendente responde `423` (`ACCOUNT_DELETION_PENDING`) sem emitir tokens.
        Depois de 5 falhas por e-mail ou 20 por IP em 15 minutos, responde `429` com `Retry-After`,
        mesmo que a senha esteja certa (FR-002).
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '423':
          description: Exclusão da conta pendente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/DeletionPendingProblem' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renova a sessão com rotação do refresh token (FR-002)
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        description: Obrigatório no mobile; no web o token vem do cookie.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Novos tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Encerra a sessão e revoga o refresh token
      description: |
        No web, o refresh token vem do cookie (cabeçalho `X-Client: web`) e o cookie é apagado. No
        mobile, informe o `refreshToken` no corpo para revogá-lo.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Sessão encerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Solicita link de redefinição de senha (FR-006, FR-007)
      description: Resposta idêntica para e-mails cadastrados e não cadastrados. Limite de 3 por hora por e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Solicitação aceita }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Define nova senha com o token recebido por e-mail (FR-006)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, format: password, minLength: 10, description: 'Mínimo de 10 caracteres e máximo de 72 bytes em UTF-8' }
      responses:
        '204': { description: Senha alterada; sessões anteriores encerradas }
        '400':
          description: Token inválido, usado ou expirado (`INVALID_RESET_TOKEN`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Dados do próprio usuário
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      summary: Altera o nome de exibição (vazio remove o nome)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, 'null'], maxLength: 80 }
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/password:
    post:
      tags: [Auth]
      summary: Troca a senha estando conectado
      description: |
        Exige a senha atual e aplica a política de senha. Todas as sessões anteriores deixam de valer
        e a resposta traz uma sessão nova (mesmo formato do login), para quem trocou seguir conectado.
        Senha atual incorreta ou nova igual à atual respondem `422` com o campo em `errors`.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200':
          description: Senha trocada; nova sessão
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/account-deletion:
    post:
      tags: [Auth]
      summary: Solicita a exclusão da conta com carência de 30 dias (FR-008)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '202':
          description: Exclusão agendada; sessões encerradas
          content:
            application/json:
              schema:
                type: object
                required: [deletionDate]
                properties:
                  deletionDate:
                    type: string
                    format: date
                    description: Data limite para desistir (hoje + 30 dias)
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/account-deletion/cancel:
    post:
      tags: [Auth]
      summary: Cancela a exclusão pendente (FR-009)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '204': { description: Exclusão cancelada; faça login normalmente }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '409':
          description: Não há exclusão pendente
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------ Accounts
  /accounts:
    get:
      tags: [Accounts]
      summary: Lista contas e cartões (FR-011)
      parameters:
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Lista de contas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Accounts]
      summary: Cadastra conta ou cartão (FR-011, FR-012)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      summary: Consulta uma conta
      responses:
        '200':
          description: Conta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Accounts]
      summary: Edita ou inativa/reativa conta (FR-011)
      description: |
        Novos dias de fechamento/vencimento valem para compras futuras. Ocorrências fixas pendentes
        com vencimento futuro são recalculadas, exceto as de faturas com pagamento registrado (FR-014).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Accounts]
      summary: Exclui conta sem nenhum dado relacionado (FR-013)
      description: |
        A conta só é excluída se não tiver lançamentos (nem grupos), pagamentos de fatura, cartões
        vinculados nem saldo inicial diferente de zero. Caso contrário responde `409`
        (`ACCOUNT_IN_USE`) com as contagens; o cliente deve oferecer inativar a conta. A checagem é
        refeita no servidor a cada exclusão. Conta de outro usuário responde `404`.
      responses:
        '204': { description: Excluída }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conta com dados relacionados (`ACCOUNT_IN_USE`); inative em vez de excluir
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/InUseProblem' }

  /accounts/{accountId}/usage:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      summary: Prévia da exclusão da conta
      description: Informa o que impede a exclusão da conta. Não altera nada.
      responses:
        '200':
          description: Uso da conta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountUsage' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------- Categories
  /categories:
    get:
      tags: [Categories]
      summary: Lista categorias (FR-015)
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/CategoryType' }
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Categories]
      summary: Cria categoria (FR-015)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Categories]
      summary: Edita categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Categories]
      summary: Exclui categoria sem uso (FR-016)
      description: |
        A categoria só é excluída se nenhum lançamento nem grupo a usa. Em uso responde `409`
        (`CATEGORY_IN_USE`) com as contagens; os lançamentos não são movidos para outra categoria.
        Categoria de outro usuário responde `404`.
      responses:
        '204': { description: Excluída }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Categoria em uso (`CATEGORY_IN_USE`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/InUseProblem' }

  /categories/{categoryId}/usage:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Categories]
      summary: Prévia da exclusão da categoria
      description: Informa quantos lançamentos e grupos usam a categoria. Não altera nada.
      responses:
        '200':
          description: Uso da categoria
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryUsage' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------- Transaction groups
  /transaction-groups:
    post:
      tags: [Transaction Groups]
      summary: Registra lançamento fixo, avulso ou parcelado (FR-017 a FR-024)
      description: |
        Gera as ocorrências conforme `recurrenceType`:
        Em conta do tipo `CREDIT_CARD`, o vencimento de **toda** ocorrência é calculado pelo
        servidor a partir de `purchaseDate` e dos dias de fechamento e vencimento do cartão
        (FR-022); `firstDueDate` é ignorado e pode ser omitido. Nas demais contas,
        `firstDueDate` é obrigatório (`422` se ausente). Conta inativa responde `422` (`ACCOUNT_INACTIVE`).
        - `VARIABLE`: 1 ocorrência.
        - `INSTALLMENT`: N parcelas, uma por mês. Soma = `totalAmount` (resto na última parcela).
        - `FIXED`: ocorrências mensais para os próximos 12 meses; no cartão, cada mês é tratado
          como compra no dia de `purchaseDate` daquele mês (limitado ao último dia do mês).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionGroupInput' }
      responses:
        '201':
          description: Grupo e ocorrências geradas
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionGroupDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transaction-groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Transaction Groups]
      summary: Consulta um grupo com suas ocorrências
      responses:
        '200':
          description: Grupo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionGroupDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Transaction Groups]
      summary: Edita descrição, categoria e conta das ocorrências pendentes (FR-025)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionGroupUpdate' }
      responses:
        '200':
          description: Atualizado
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionGroupDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Transaction Groups]
      summary: Exclui o grupo e as ocorrências pendentes (FR-025)
      description: |
        Exige `confirm=true`. Ocorrências já pagas são preservadas; consulte antes
        `/transaction-groups/{groupId}/impact`. Se a exclusão violar o saldo de uma fatura
        (restante < 0), responde `409 INVOICE_BALANCE_VIOLATION`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: confirm
          in: query
          required: true
          schema: { type: boolean }
      responses:
        '204':
          description: Excluído
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /transaction-groups/{groupId}/impact:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Transaction Groups]
      summary: Mostra o efeito de excluir ou alterar o grupo sobre parcelas pagas (FR-025)
      responses:
        '200':
          description: Impacto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupImpact' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transaction-groups/{groupId}/amount-changes:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [Transaction Groups]
      summary: Altera o valor de um lançamento fixo a partir de um mês (FR-020)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromMonth, amount]
              properties:
                fromMonth: { $ref: '#/components/schemas/Month' }
                amount: { $ref: '#/components/schemas/Money' }
      responses:
        '200':
          description: Ocorrências pendentes a partir do mês foram atualizadas
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionGroupDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transaction-groups/{groupId}/end:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [Transaction Groups]
      summary: Encerra um lançamento fixo (FR-020)
      description: "Destrutivo: as ocorrências pendentes depois de `endMonth` são removidas. O cliente deve pedir confirmação."
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endMonth]
              properties:
                endMonth:
                  allOf:
                    - $ref: '#/components/schemas/Month'
                  description: Último mês com ocorrência; as pendentes posteriores são removidas
      responses:
        '200':
          description: Encerrado
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionGroupDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # --------------------------------------------------------- Transactions
  /transactions:
    get:
      tags: [Transactions]
      summary: Lista lançamentos com filtros (FR-027)
      parameters:
        - name: month
          in: query
          description: Mês de vencimento
          schema: { $ref: '#/components/schemas/Month' }
        - name: accountId
          in: query
          schema: { type: integer, format: int64 }
        - name: categoryId
          in: query
          schema: { type: integer, format: int64 }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/CategoryType' }
        - name: recurrenceType
          in: query
          schema: { $ref: '#/components/schemas/RecurrenceType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TransactionStatus' }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Página de lançamentos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }

  /transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      tags: [Transactions]
      summary: Consulta um lançamento
      responses:
        '200':
          description: Lançamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Transactions]
      summary: Edita valor ou vencimento de uma ocorrência (FR-025)
      description: |
        Despesa: só ocorrências pendentes (paga responde `409`). Receita (fora do cartão): também
        a já recebida. O status só é reavaliado quando o `dueDate` muda: novo `dueDate` hoje ou
        anterior fica `PAID` (com `paymentDate` = novo `dueDate`) e `dueDate` futuro fica `PENDING`.
        Editar só o valor não altera `status` nem `paymentDate`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionPatch' }
      responses:
        '200':
          description: Atualizado
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transactions/{transactionId}/pay:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags: [Transactions]
      summary: Marca o lançamento como pago (FR-019)
      description: |
        Em receita, só vale para receita futura (antecipação do recebimento). Receita com vencimento
        hoje ou anterior já entra paga automaticamente. Lançamento já pago responde `409`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentDate]
              properties:
                paymentDate: { type: string, format: date }
      responses:
        '200':
          description: Pago
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /transactions/{transactionId}/unpay:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags: [Transactions]
      summary: Reverte o pagamento do lançamento (FR-019)
      description: |
        Em receita, só vale para receita futura antecipada (volta a `PENDING`). Receita com
        vencimento hoje ou anterior responde `409`: para corrigir, edite ou exclua o lançamento.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Voltou para pendente
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------- Invoices
  /accounts/{accountId}/invoices/{month}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/MonthPath'
    get:
      tags: [Invoices]
      summary: Consulta uma fatura de cartão com itens, pagos e restante (FR-028, FR-035)
      responses:
        '200':
          description: Fatura
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{accountId}/invoices/{month}/payments:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/MonthPath'
    post:
      tags: [Invoices]
      summary: Registra pagamento total ou parcial da fatura (FR-034 a FR-038)
      description: |
        Valor deve ser > 0 e ≤ restante. Se o restante chegar a zero, todos os itens
        pendentes passam a pagos (FR-036). Acima do restante: `409 INVOICE_BALANCE_VIOLATION`. Cartão inativo ainda aceita pagamento.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoicePaymentInput' }
      responses:
        '201':
          description: Pagamento registrado; retorna a fatura atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /accounts/{accountId}/invoices/{month}/payments/settle:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/MonthPath'
    post:
      tags: [Invoices]
      summary: Paga a fatura pelo saldo restante total (FR-037)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paidAt]
              properties:
                paidAt: { type: string, format: date }
      responses:
        '201':
          description: Fatura quitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invoice-payments/{paymentId}:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [Invoices]
      summary: Desfaz um pagamento de fatura (FR-037)
      description: "Destrutivo (o cliente deve pedir confirmação, exceto no desfazer imediato após o pagamento). Itens quitados automaticamente voltam a pendentes; itens pagos individualmente permanecem pagos."
      responses:
        '200':
          description: Fatura atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoices/projection:
    get:
      tags: [Invoices]
      summary: Projeção de faturas futuras por cartão (FR-028)
      parameters:
        - name: from
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Month' }
        - name: months
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 12 }
        - name: accountId
          in: query
          description: Restringe a um cartão
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Totais por cartão e mês
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceProjection' }

  # ------------------------------------------------------------ Dashboard
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Indicadores e gráficos do mês, por vencimento (FR-030, FR-031)
      parameters:
        - name: month
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Month' }
      responses:
        '200':
          description: Painel do mês
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }

  /balances:
    get:
      tags: [Dashboard]
      summary: Saldo por conta e total, acumulado até hoje
      description: |
        Para cada conta `CHECKING` ou `CASH` (ativas e inativas): saldo inicial + receitas recebidas
        (`PAID` com pagamento até hoje) − despesas pagas da própria conta − saídas dos cartões vinculados
        (despesas de cartão pagas individualmente e pagamentos de fatura com data até hoje).
        Saídas de cartão sem conta vinculada não debitam nenhuma conta e somam em `unlinkedCardPayments`.
        Itens de cartão quitados por pagamento de fatura não são contados de novo.
      responses:
        '200':
          description: Saldos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balances' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cashflow:
    get:
      tags: [Dashboard]
      summary: Saldo residual por mês = receitas previstas − despesas previstas (FR-029)
      parameters:
        - name: from
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Month' }
        - name: months
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 12 }
      responses:
        '200':
          description: Fluxo de caixa mensal
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CashflowMonth' }

  /due-summary:
    get:
      tags: [Dashboard]
      summary: Contagem de vencimentos por dia para os lembretes do aplicativo
      description: |
        Itens pendentes fora de cartão e faturas de cartão com saldo restante, por data de vencimento
        no período `from`..`to` (até 62 dias), mais o que está atrasado (vencimento antes de hoje).
        Nunca traz valores, descrições nem nomes. O aplicativo consulta a partir de hoje.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Vencimentos do período e atrasados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DueSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ClientHeader:
      name: X-Client
      in: header
      description: "`web` entrega o refresh token em cookie HttpOnly; ausente (mobile) entrega no corpo"
      schema: { type: string, enum: [web] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUID gerado pelo cliente (operações feitas offline no aplicativo: criar, pagar, desfazer, editar e
        excluir lançamentos, alterar valor e encerrar). A query string (ex.:
        `confirm=true`) não conta na identidade. Repetir a mesma chave, com o
        mesmo caminho e corpo, devolve a resposta original com `Idempotent-Replayed: true` sem repetir
        o efeito. Chave em processamento responde `409` (`IDEMPOTENCY_IN_PROGRESS`); chave usada com
        outro caminho ou corpo responde `422` (`IDEMPOTENCY_KEY_REUSED`); chave que não é UUID, `400`.
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MonthPath:
      name: month
      in: path
      required: true
      description: Mês do vencimento da fatura
      schema: { $ref: '#/components/schemas/Month' }

  headers:
    IdempotentReplayed:
      description: "`true` quando a resposta é a original guardada para a chave de idempotência"
      schema: { type: string, enum: ['true'] }

  responses:
    BadRequest:
      description: Requisição inválida (período, cabeçalho ou parâmetro malformado)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Credenciais ausentes, inválidas ou expiradas
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Recurso inexistente ou de outro usuário
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflito de regra de negócio ou versão desatualizada (`STALE_VERSION`, `INVOICE_BALANCE_VIOLATION`, …)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Dados inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    TooManyRequests:
      description: Limite de solicitações excedido
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: '1234.56'
    Month:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: '2026-11'
    AccountType:
      type: string
      enum: [CHECKING, CASH, CREDIT_CARD]
    HolderType:
      type: string
      enum: [PF, PJ]
      description: "Titularidade da conta bancária: pessoa física ou jurídica (classificação, sem separar dados)."
    AccountIcon:
      type: string
      enum: [bank, building, briefcase, landmark, wallet, cash, piggy, card, card-gold, card-platinum, card-black, shield, rocket, star, globe, shopping-bag]
    CategoryType:
      type: string
      enum: [INCOME, EXPENSE]
    RecurrenceType:
      type: string
      enum: [FIXED, VARIABLE, INSTALLMENT]
    TransactionStatus:
      type: string
      enum: [PENDING, PAID]

    DueSummary:
      type: object
      required: [days, overdue]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, items, invoices]
            properties:
              date: { type: string, format: date }
              items: { type: integer, minimum: 0 }
              invoices: { type: integer, minimum: 0 }
        overdue:
          type: object
          required: [items, invoices]
          properties:
            items: { type: integer, minimum: 0 }
            invoices: { type: integer, minimum: 0 }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type: { type: string }
        instance: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Código estável legível por máquina
          example: INVOICE_BALANCE_VIOLATION
        remainingBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Presente em `INVOICE_BALANCE_VIOLATION`
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          additionalProperties: true
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
    InUseProblem:
      description: "`409` de exclusão bloqueada (`ACCOUNT_IN_USE`, `CATEGORY_IN_USE`) com o que está em uso."
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          additionalProperties: true
          properties:
            transactionCount: { type: integer, format: int64, description: "Lançamentos que usam a conta ou a categoria." }
            groupCount: { type: integer, format: int64, description: "Grupos de lançamento que usam a categoria." }
            invoicePaymentCount: { type: integer, format: int64, description: "Pagamentos de fatura da conta." }
            linkedCardCount: { type: integer, format: int64, description: "Cartões vinculados à conta bancária." }
            hasOpeningBalance: { type: boolean, description: "A conta tem saldo inicial diferente de zero." }
    DeletionPendingProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          additionalProperties: true
          required: [deletionDate]
          properties:
            deletionDate: { type: string, format: date }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 10, description: 'Mínimo de 10 caracteres e máximo de 72 bytes em UTF-8 (limite do BCrypt), validado no servidor' }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Segundos até expirar (900) }
        refreshToken:
          type: string
          description: Presente apenas fora do modo web
    UserProfile:
      type: object
      required: [id, email, createdAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: [string, 'null'], description: Nome de exibição; nulo até o usuário informar }
        createdAt: { type: string, format: date-time }

    Account:
      type: object
      required: [id, name, type, active, version, openingBalance]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        holderType:
          $ref: '#/components/schemas/HolderType'
          description: "Em conta bancária, o titular; em cartão, o titular herdado da conta vinculada (ausente se o cartão não tem vínculo)."
        icon:
          $ref: '#/components/schemas/AccountIcon'
          description: "Sempre presente: o escolhido ou o padrão do tipo."
        bankAccountId: { type: integer, format: int64, description: "Somente em cartão vinculado." }
        bankAccountName: { type: string, description: "Nome da conta bancária do cartão." }
        colorHex:
          type: string
          pattern: '^#[0-9A-F]{6}$'
          description: "Cor personalizada do ícone, em maiúsculas. Ausente quando a conta usa o visual padrão do tipo."
        openingBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: "Saldo inicial da conta (parte do saldo de `GET /balances`). Sempre devolvido; `0.00` quando nunca informado e sempre `0.00` em cartão de crédito."
        active: { type: boolean }
        version: { type: integer, format: int64 }
    AccountInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        type: { $ref: '#/components/schemas/AccountType' }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        holderType: { $ref: '#/components/schemas/HolderType' }
        icon: { $ref: '#/components/schemas/AccountIcon' }
        bankAccountId: { type: integer, format: int64 }
        colorHex:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: "Cor personalizada do ícone (`#RRGGBB`; o servidor guarda em maiúsculas). Opcional: ausente usa o visual padrão do tipo. Texto vazio ou fora do formato responde `422` com erro no campo `colorHex`."
        openingBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: "Saldo inicial da conta, pode ser negativo. Opcional: ausente vale `0.00`. Valor diferente de zero em CREDIT_CARD responde `422` com erro no campo `openingBalance`."
      description: "`closingDay` e `dueDay` são obrigatórios para CREDIT_CARD e proibidos nos demais tipos. `holderType` é obrigatório em CHECKING e proibido nos demais. `bankAccountId` (conta bancária ativa do mesmo usuário) é obrigatório em CREDIT_CARD e proibido nos demais; conta de outro usuário responde 404 e conta inativa, 422 ACCOUNT_INACTIVE. `icon` ausente usa o padrão do tipo."
    AccountUpdate:
      type: object
      required: [name, type, active, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        type: { $ref: '#/components/schemas/AccountType' }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        holderType: { $ref: '#/components/schemas/HolderType' }
        icon: { $ref: '#/components/schemas/AccountIcon' }
        bankAccountId: { type: integer, format: int64 }
        colorHex:
          type: string
          pattern: '^(#[0-9A-Fa-f]{6})?$'
          description: "Cor personalizada do ícone (`#RRGGBB`; o servidor guarda em maiúsculas). Ausente mantém a cor atual (assim um cliente antigo não apaga cores); a string vazia `\"\"` remove a cor e volta ao visual padrão do tipo. Formato inválido responde `422` com erro no campo `colorHex`."
        openingBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: "Saldo inicial da conta. Opcional: ausente mantém o valor atual. Valor diferente de zero em CREDIT_CARD responde `422` com erro no campo `openingBalance`."
        active: { type: boolean }
        version: { type: integer, format: int64 }
      description: "O tipo não pode ser alterado depois do cadastro; os demais campos seguem as regras de AccountInput. Cartão anterior ao vínculo (sem `bankAccountId`) precisa informá-lo ao ser editado, exceto quando só `active` muda."
    AccountUsage:
      type: object
      required: [canDelete, transactionCount, invoicePaymentCount, linkedCards, openingBalance]
      description: "Prévia da exclusão. `canDelete` é verdadeiro só sem lançamentos, pagamentos de fatura, cartões vinculados e saldo inicial."
      properties:
        canDelete: { type: boolean }
        transactionCount: { type: integer, format: int64 }
        invoicePaymentCount: { type: integer, format: int64 }
        linkedCards:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
        openingBalance: { $ref: '#/components/schemas/Money' }

    Category:
      type: object
      required: [id, name, type, colorHex]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/CategoryType' }
        colorHex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
    CategoryUsage:
      type: object
      required: [canDelete, transactionCount, groupCount]
      properties:
        canDelete: { type: boolean }
        transactionCount: { type: integer, format: int64 }
        groupCount: { type: integer, format: int64 }
    CategoryInput:
      type: object
      required: [name, type, colorHex]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        type: { $ref: '#/components/schemas/CategoryType' }
        colorHex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }

    TransactionGroupInput:
      type: object
      required: [description, recurrenceType, totalAmount, accountId, categoryId, purchaseDate]
      properties:
        description: { type: string, minLength: 1, maxLength: 120 }
        recurrenceType: { $ref: '#/components/schemas/RecurrenceType' }
        totalAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Valor total (INSTALLMENT), valor mensal (FIXED) ou valor único (VARIABLE)
        totalInstallments:
          type: integer
          minimum: 1
          maximum: 120
          description: Obrigatório para INSTALLMENT (1 vira um avulso; até 120); nos demais tipos é 1 e pode ser omitido
        accountId:
          type: integer
          format: int64
          description: >-
            Receita (categoria `INCOME`) só pode entrar em conta `CHECKING` ou `CASH`: em conta do tipo
            `CREDIT_CARD` responde `422` com erro no campo `accountId`
            ("Receitas só podem entrar em conta bancária ou dinheiro, não em cartão de crédito.").
        categoryId: { type: integer, format: int64 }
        purchaseDate: { type: string, format: date }
        firstDueDate:
          type: string
          format: date
          description: >-
            Obrigatório fora do cartão de crédito; ignorado em cartão (calculado pelo servidor). Para receita,
            é a data em que o dinheiro entra na conta: data de hoje ou anterior entra automaticamente
            (`PAID`); data futura fica `PENDING` até a data chegar.
    TransactionGroupUpdate:
      type: object
      required: [description, categoryId, version]
      properties:
        description: { type: string, minLength: 1, maxLength: 120 }
        categoryId: { type: integer, format: int64 }
        version: { type: integer, format: int64 }
    TransactionGroupDetail:
      type: object
      required: [id, description, recurrenceType, totalInstallments, totalAmount, accountId, categoryId, purchaseDate, version, transactions]
      properties:
        id: { type: integer, format: int64 }
        description: { type: string }
        recurrenceType: { $ref: '#/components/schemas/RecurrenceType' }
        totalInstallments: { type: integer }
        totalAmount: { $ref: '#/components/schemas/Money' }
        accountId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        purchaseDate: { type: string, format: date }
        endMonth: { $ref: '#/components/schemas/Month' }
        version: { type: integer, format: int64 }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
    GroupImpact:
      type: object
      required: [paidCount, pendingCount, paidAmount, pendingAmount]
      properties:
        paidCount: { type: integer }
        pendingCount: { type: integer }
        paidAmount: { $ref: '#/components/schemas/Money' }
        pendingAmount: { $ref: '#/components/schemas/Money' }

    Transaction:
      type: object
      required: [id, groupId, accountId, categoryId, description, installmentNumber, totalInstallments, amount, dueDate, status, overdue, version]
      properties:
        id: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }
        accountId: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        description: { type: string }
        recurrenceType: { $ref: '#/components/schemas/RecurrenceType' }
        installmentNumber: { type: integer }
        totalInstallments: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
        dueDate: { type: string, format: date }
        paymentDate: { type: string, format: date }
        status:
          allOf:
            - $ref: '#/components/schemas/TransactionStatus'
          description: >-
            Em receita, `PAID` automático quando `dueDate` é hoje ou anterior (o servidor liquida na
            consulta, com `paymentDate` igual a `dueDate`); receita futura fica `PENDING` até a data
            chegar, a menos que seja antecipada pela ação `pay`.
        settledByInvoicePayment:
          type: boolean
          description: Verdadeiro se foi marcado como pago pela quitação da fatura
        overdue:
          type: boolean
          description: Despesa pendente com vencimento anterior a hoje. Em receita é sempre `false` (receita nunca fica atrasada).
        version: { type: integer, format: int64 }
    TransactionPatch:
      type: object
      required: [version]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        dueDate: { type: string, format: date }
        version: { type: integer, format: int64 }
    TransactionPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }

    Invoice:
      type: object
      required: [accountId, month, dueDate, total, paidIndividually, paidByInvoicePayments, remaining, items, payments]
      properties:
        accountId: { type: integer, format: int64 }
        month: { $ref: '#/components/schemas/Month' }
        dueDate:
          type: string
          format: date
          description: Vencimento mais recente entre os itens da fatura (pode haver mais de um após mudança dos dias do cartão)
        total: { $ref: '#/components/schemas/Money' }
        paidIndividually: { $ref: '#/components/schemas/Money' }
        paidByInvoicePayments: { $ref: '#/components/schemas/Money' }
        remaining:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: total − paidIndividually − paidByInvoicePayments (nunca negativo)
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/InvoicePayment' }
    InvoicePayment:
      type: object
      required: [id, amount, paidAt]
      properties:
        id: { type: integer, format: int64 }
        amount: { $ref: '#/components/schemas/Money' }
        paidAt: { type: string, format: date }
    InvoicePaymentInput:
      type: object
      required: [amount, paidAt]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        paidAt: { type: string, format: date }
    InvoiceProjection:
      type: object
      required: [months, cards]
      properties:
        months:
          type: array
          items: { $ref: '#/components/schemas/Month' }
        cards:
          type: array
          items:
            type: object
            required: [accountId, name, invoices, totalCommitted]
            properties:
              accountId: { type: integer, format: int64 }
              name: { type: string }
              totalCommitted:
                allOf:
                  - $ref: '#/components/schemas/Money'
                description: Soma do restante das faturas do intervalo
              invoices:
                type: array
                items:
                  type: object
                  required: [month, total, remaining]
                  properties:
                    month: { $ref: '#/components/schemas/Month' }
                    total: { $ref: '#/components/schemas/Money' }
                    remaining: { $ref: '#/components/schemas/Money' }

    Dashboard:
      type: object
      required: [month, totalMonth, totalToDue, totalPaid, overdueTotal, totalIncome, totalReceived, byCategory, byCard]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        totalMonth:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Despesas com vencimento no mês
        totalToDue:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Restante ainda não vencido do mês (faturas de cartão pelo restante da fatura; demais itens pelo valor pendente)
        totalPaid:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >-
            Soma de itens com vencimento no mês marcados como pagos individualmente (sem `settledByInvoicePayment`)
            mais os pagamentos de fatura cuja fatura vence no mês. Itens quitados por pagamento de fatura
            não são somados de novo.
        overdueTotal: { $ref: '#/components/schemas/Money' }
        totalIncome:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Receitas com vencimento no mês (recebidas ou não)
        totalReceived:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Parte das receitas do mês que já entrou na conta (receita com vencimento até hoje ou antecipada)
        byCategory:
          type: array
          items:
            type: object
            required: [categoryId, name, colorHex, amount]
            properties:
              categoryId: { type: integer, format: int64 }
              name: { type: string }
              colorHex: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
        byCard:
          type: array
          items:
            type: object
            required: [accountId, name, amount]
            properties:
              accountId: { type: integer, format: int64 }
              name: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
    AccountBalance:
      type: object
      required: [accountId, name, type, active, balance, openingBalance]
      properties:
        accountId: { type: integer, format: int64 }
        name: { type: string }
        type:
          type: string
          enum: [CHECKING, CASH]
        active: { type: boolean }
        balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Saldo acumulado até hoje (pode ser negativo)
        openingBalance: { $ref: '#/components/schemas/Money' }
    Balances:
      type: object
      required: [asOf, total, accounts, unlinkedCardPayments]
      properties:
        asOf: { type: string, format: date, description: Data de referência do saldo (hoje, no fuso do servidor) }
        total:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Soma dos saldos de todas as contas (inclusive inativas com saldo diferente de zero)
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountBalance' }
        unlinkedCardPayments:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Saídas de cartões sem conta vinculada, que não debitam nenhuma conta
    CashflowMonth:
      type: object
      required: [month, expectedIncome, expectedExpense, residual]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        expectedIncome: { $ref: '#/components/schemas/Money' }
        expectedExpense: { $ref: '#/components/schemas/Money' }
        residual:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: expectedIncome − expectedExpense (pode ser negativo)
